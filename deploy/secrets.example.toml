# Top-level values become environment variables in Streamlit.
# Use real values only in a gitignored secrets.toml or a cloud secret manager.
OPENAI_API_KEY = "configure-in-secret-manager"
GEOAPIFY_API_KEY = "configure-in-secret-manager"
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "configure-in-secret-manager"
# Approved administrator OIDC identities, not email addresses.
ADMIN_PRINCIPALS = '[["https://your-issuer", "your-subject"]]'

[auth]
redirect_uri = "https://your-app-host/oauth2callback"
cookie_secret = "generate-a-long-random-cookie-secret"
client_id = "your-oidc-client-id"
client_secret = "configure-in-secret-manager"
server_metadata_url = "https://your-provider/.well-known/openid-configuration"
